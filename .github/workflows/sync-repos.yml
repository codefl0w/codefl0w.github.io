name: Sync Repositories

on:
  schedule:
    - cron: '0 4 * * 0' # Every Sunday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-repos
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Sync repos and stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sync_repos.py

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/projects.yml
          if git diff --staged --quiet; then
            echo "No repository changes or star updates detected."
          else
            git commit -m "chore(data): auto-sync github projects and stars"
            git push origin main
            echo "Changes pushed. Triggering Pages build..."
            gh workflow run "Build and deploy Pages" --ref main || true
          fi
